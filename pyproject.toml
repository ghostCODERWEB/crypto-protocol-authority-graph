[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-protocol-authority-graph"
version = "0.1.0"
description = "Trace role delegation, threshold controls, timelocks and compromised-principal paths through protocol permissions."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-protocol-authority-graph = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
